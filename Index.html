<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VIP CHANNEL WITH TEAM JACK</title>
  <meta name="description" content="Join the VIP Channel with Team Jack for exclusive updates and member-only content.">
  <meta name="robots" content="index, follow">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      background:
        radial-gradient(circle at 50% 15%, rgba(35, 72, 130, 0.45), transparent 35%),
        linear-gradient(145deg, #020611, #071326 55%, #02050b);
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 16px;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(0, 110, 255, 0.16);
      filter: blur(70px);
      pointer-events: none;
    }

    .glow.one {
      top: -100px;
      left: -100px;
    }

    .glow.two {
      right: -100px;
      bottom: -100px;
      background: rgba(0, 180, 255, 0.12);
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 430px;
      padding: 34px 24px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 28px;
      background: rgba(6, 15, 30, 0.78);
      box-shadow:
        0 25px 70px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
    }

    .dp-box {
      width: 118px;
      height: 118px;
      margin: 0 auto 22px;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff, #6ba8ff, #fff);
      box-shadow:
        0 0 25px rgba(60, 145, 255, 0.45),
        0 0 55px rgba(0, 105, 255, 0.20);
    }

    .dp {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #101827;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 14px;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(255,255,255,0.055);
      color: #b9d7ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 39px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 span {
      display: block;
      background: linear-gradient(90deg, #ffffff, #9cc9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #9baac0;
      font-size: 14px;
      line-height: 1.65;
      max-width: 330px;
      margin: 0 auto 23px;
    }

    .features {
      display: grid;
      gap: 10px;
      margin-bottom: 24px;
      text-align: left;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      color: #dce8f8;
      font-size: 13px;
    }

    .icon {
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: rgba(55, 137, 255, 0.15);
      color: #75b1ff;
      font-size: 15px;
    }

    .join-btn {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .3px;
      cursor: pointer;
      background: linear-gradient(135deg, #1976ff, #0757d9);
      box-shadow:
        0 12px 30px rgba(20, 102, 235, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.20);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 16px 38px rgba(20, 102, 235, 0.40),
        inset 0 1px 0 rgba(255,255,255,0.20);
    }

    .join-btn:active {
      transform: scale(.98);
    }

    .telegram-icon {
      width: 25px;
      height: 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      font-size: 13px;
    }

    .private {
      margin-top: 18px;
      color: #66758c;
      font-size: 11px;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      .page {
        padding: 15px;
      }

      .card {
        padding: 29px 18px 25px;
        border-radius: 24px;
      }

      .dp-box {
        width: 105px;
        height: 105px;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <section class="card">

      <!-- CHANNEL DP -->
      <div class="dp-box">
        <img
          class="dp"
          src="https://indexteamjackfinal.vercel.app/favicon.ico"
          alt="Team Jack"
          onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg,#1b65d8,#071326)'"
        >
      </div>

      <div class="badge">
        ♛ PRIVATE CHANNEL
      </div>

      <h1>
        VIP CHANNEL
        <span>WITH TEAM JACK</span>
      </h1>

      <p class="subtitle">
        Join our private community and get access to exclusive
        updates and member-only content.
      </p>

      <div class="features">

        <div class="feature">
          <div class="icon">✓</div>
          <div>Exclusive member updates</div>
        </div>

        <div class="feature">
          <div class="icon">⚡</div>
          <div>Regular premium content</div>
        </div>

        <div class="feature">
          <div class="icon">🔒</div>
          <div>Private community access</div>
        </div>

      </div>

      <!-- TELEGRAM JOIN BUTTON -->
      <a
        class="join-btn"
        href="https://t.me/+Pm5zG_WJqw9lOGM1"
        target="_blank"
        rel="noopener noreferrer"
        onclick="trackJoin()"
      >
        <span class="telegram-icon">➤</span>
        JOIN PRIVATE CHANNEL
      </a>

      <div class="private">
        Secure • Private • Exclusive
      </div>

    </section>
  </main>

  <script>
    function trackJoin() {
      // Optional Meta Pixel event.
      // Pixel code yahan add kar sakte ho.
      if (typeof fbq === "function") {
        fbq("track", "Lead");
      }
    }
  </script>

</body>
</html>
